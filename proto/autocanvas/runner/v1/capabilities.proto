syntax = "proto3";

package autocanvas.runner.v1;

// What a runner offers. The server only offers jobs whose requirements a runner meets.
message Capabilities {
  // Labels used for matching jobs' runs_on, for example "linux", "docker", "gpu".
  repeated string labels = 1;
  // How steps are executed.
  Executor executor = 2;
  // Operating system, as GOOS-style names: "linux", "windows", "darwin".
  string os = 3;
  // CPU architecture, as GOARCH-style names: "amd64", "arm64".
  string arch = 4;
  // Node types the runner can execute (for example "http_request", "docker_build"). Script steps
  // are always supported.
  repeated string node_types = 5;
  // Number of jobs the runner runs at the same time; at least 1.
  uint32 max_concurrent_jobs = 6;
  // Runner implementation and version, for example "autocanvas-runner-dotnet/0.1.0".
  string runner_version = 7;
  // Shells available for script steps: "bash", "sh", "pwsh", "cmd".
  repeated string shells = 8;
}

// Where a runner executes steps.
enum Executor {
  // Not set; treated as an error.
  EXECUTOR_UNSPECIFIED = 0;
  // Each job runs in a container (its image, or a default image); services are containers too.
  EXECUTOR_CONTAINER = 1;
  // Steps run directly on the runner's host, without isolation. Jobs with an image or services
  // cannot run here.
  EXECUTOR_HOST = 2;
}
