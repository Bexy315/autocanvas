name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET (format, build, test, coverage, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Database tests run on SQLite and on PostgreSQL (Testcontainers, Docker is preinstalled);
      # in CI they must not be skipped (ADR-0010).
      - name: Test (coverage gate 75 % per project)
        run: dotnet test --configuration Release --no-build
        env:
          AUTOCANVAS_REQUIRE_POSTGRES: "1"

      - name: Coverage summary
        if: always()
        run: |
          if compgen -G "artifacts/coverage/*.xml" > /dev/null; then
            dotnet reportgenerator -reports:'artifacts/coverage/*.xml' -targetdir:artifacts/coverage/report -reporttypes:'MarkdownSummaryGithub;Html'
            cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: ignore

      - name: Dependency licenses
        run: dotnet nuget-license --input AutoCanvas.slnx --include-transitive --allowed-license-types build/allowed-licenses.json

  protocol:
    name: Protocol (buf lint, format, breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          setup_only: true

      - name: Lint
        run: buf lint

      - name: Format
        run: buf format --diff --exit-code

      # Wire and JSON compatibility with the PR's base (ADR-0004: additive changes only within v1).
      - name: Breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=$BASE_SHA"
          else
            echo "The base has no protocol yet; nothing to compare against."
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
