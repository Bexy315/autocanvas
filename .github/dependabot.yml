version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ['*']
    ignore:
      # @docusaurus/tsconfig still sets `baseUrl`, which TypeScript 7 removed.
      # Lift this once Docusaurus supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=6']
    commit-message:
      prefix: docs
